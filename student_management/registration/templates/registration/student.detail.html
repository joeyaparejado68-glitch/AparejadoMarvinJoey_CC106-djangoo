<!DOCTYPE html>
<html>
<head>
    <title>Student Details</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'registration/style.css' %}">
</head>
<body>
    <h1>Student Details</h1>
    <dl>
        <dt>Student ID</dt><dd>{{ student.student_id }}</dd>
        <dt>First name</dt><dd>{{ student.first_name }}</dd>
        <dt>Last name</dt><dd>{{ student.last_name }}</dd>
        <dt>Gender</dt><dd>{{ student.gender }}</dd>
        <dt>Date of birth</dt><dd>{{ student.date_of_birth }}</dd>
        <dt>Contact number</dt><dd>{{ student.contact_number }}</dd>
    </dl>
    <p>
        <a href="{% url 'student_update' student.pk %}">Edit</a> |
        <a href="{% url 'student_delete' student.pk %}">Delete</a> |
        <a href="{% url 'student_list' %}">Back to students</a>
    </p>
</body>
</html>
